<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>LinkedIn Content Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen planner. Pillar rail on the left, scrolling timeline on the right, detail drawer slides in from the right edge. */
:root{
  --bg:#FFFFFF; --surface:#F6F8FC; --surface-2:#EEF2F9; --fg:#132662; --ink:#2B2B2B; --muted:#56618A; --line:#D6DEEB; --line-strong:#B9C6DE;
  --accent:#005FFF; --midnight:#132662; --teal:#59D1C7; --bad:#E0312B; --warn:#F5B800; --good:#1F9D55;
  --shadow:0 12px 40px rgba(19,38,98,.18);
  --font-display:"Outfit","Montserrat",system-ui,sans-serif;
  --font-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1430; --surface:#121D3F; --surface-2:#192650; --fg:#EEF2FA; --ink:#E4E9F5; --muted:#9AA7C7; --line:#263561; --line-strong:#3A4C80;
    --accent:#4087FF; --midnight:#EEF2FA; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1430; --surface:#121D3F; --surface-2:#192650; --fg:#EEF2FA; --ink:#E4E9F5; --muted:#9AA7C7; --line:#263561; --line-strong:#3A4C80;
  --accent:#4087FF; --midnight:#EEF2FA; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:13px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px 10px;gap:8px;min-width:0}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.top h1{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);margin:0;color:var(--fg);letter-spacing:-.01em;text-wrap:balance;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.top .logo{margin-left:auto;height:44px;width:auto;max-width:40vw;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend.foot{padding:6px 2px 2px;border-top:1px solid var(--line);margin-top:4px}
.legend.foot.pin{position:sticky;left:0;bottom:0;z-index:4;background:var(--bg);width:100%;max-width:100%;padding:8px 12px;margin-top:0;box-sizing:border-box}
.legend .k{display:inline-flex;align-items:center;gap:5px}
.legend .k i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c)}
.legend .key{font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.06em;font-size:10px;margin-right:2px}
.legend .brk{flex-basis:100%;height:0}
.todaycol{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 9%,transparent);pointer-events:none}
.wkndcol{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--muted) 12%,transparent);pointer-events:none}
.tl-cols div.wk{color:var(--muted);font-size:11px}
/* Calendar (month page) view */
.cal-wrap{padding:12px;display:flex;flex-direction:column;gap:20px;min-width:960px}
.cal-month h2{background:var(--midnight);color:var(--bg);text-align:center;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.1em;margin:0;padding:6px;text-transform:uppercase}
:root[data-theme="dark"] .cal-month h2{background:#263561;color:#EEF2FA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cal-month h2{background:#263561;color:#EEF2FA}}
.cal-grid{border:1px solid var(--line);border-top:0}
.cal-head,.cal-week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.55fr) minmax(0,.55fr)}
.cal-head div{padding:5px 8px;border-right:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg)}
.cal-head div:last-child,.cal-cell:last-child{border-right:0}
.cal-week{border-top:1px solid var(--line)}
.cal-cell{min-height:96px;border-right:1px solid var(--line);padding:3px 4px 6px;display:flex;flex-direction:column;gap:3px;background:var(--bg);min-width:0}
.cal-cell.wk{background:var(--surface)}
.cal-cell.out{background:var(--surface-2)}
.cal-cell.out .cal-day span{opacity:.4}
.cal-day{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-weight:700;font-size:12px;color:var(--fg);min-height:20px}
.cal-cell.today .cal-day span{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px}
.cal-day .add{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0 5px;border-radius:5px;opacity:0;margin-right:auto}
.cal-cell:hover .cal-day .add{opacity:1}
.cal-day .add:hover{background:var(--surface-2);color:var(--accent)}
.cal-post{border:0;border-radius:3px;background:var(--pc);color:#fff;font-size:11px;font-weight:600;padding:3px 6px;text-align:left;display:flex;align-items:center;gap:5px;width:100%;min-width:0}
.cal-post.light{color:#132662}
.cal-post:hover{filter:brightness(1.08);outline:2px solid var(--accent);outline-offset:1px}
.cal-post span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-post i.st{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.cal-post.light i.st{box-shadow:0 0 0 1.5px rgba(19,38,98,.5)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ctl{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.ctl select,.ctl input{padding:6px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;max-width:170px}
.ctl input[type="search"]{width:170px}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);padding:7px 12px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12px}
.menu{position:relative}
.menu .pop{position:absolute;left:0;top:calc(100% + 6px);}
.menu .pop.flip{left:auto;right:0}
.menu .pop{background:var(--bg);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);min-width:250px;padding:6px;z-index:30;display:flex;flex-direction:column}
.menu .pop button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:7px;font-weight:500;color:var(--ink)}
.menu .pop button:hover{background:var(--surface-2)}
.menu .pop small{display:block;color:var(--muted);font-weight:400}
.chip{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.chip.warn i{background:var(--warn)}
.chip.err i{background:var(--bad)}

.stage{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;background:var(--bg)}
.tl{display:grid;grid-template-columns:var(--labw) 1fr;min-width:max-content;position:relative}
.tl-corner{position:sticky;left:0;top:0;z-index:6;background:var(--bg);border-bottom:2px solid var(--line-strong);border-right:1px solid var(--line)}
.tl-head{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line-strong);display:flex;flex-direction:column}
.tl-months{display:flex;height:22px}
.tl-months div{border-right:1px solid var(--line);font-size:11px;color:var(--muted);padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tl-cols{display:flex;height:34px}
.tl-cols div{flex:none;width:var(--colw);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden}
.tl-cols div.now{color:var(--fg);font-weight:700}
.weekly .tl-cols div{font-size:11px}
.tl-label{position:sticky;left:0;z-index:4;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-family:var(--font-display);font-weight:500;font-size:15px;color:var(--fg);background:color-mix(in srgb,var(--pc) 9%,var(--bg))}
.tl-label i{width:14px;height:14px;border-radius:50%;background:var(--pc);flex:none}
.tl-label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-label .add{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px;opacity:.55}
.tl-label:hover .add{opacity:1}
.tl-label .add:hover{background:var(--bg);color:var(--accent)}
.tl-track{position:relative;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--pc) 6%,var(--bg));min-height:46px;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--colw) - 1px),var(--line) calc(var(--colw) - 1px),var(--line) var(--colw))}
.tl-row.alt .tl-track{background-color:color-mix(in srgb,var(--pc) 10%,var(--bg))}
.bar{position:absolute;height:24px;border-radius:7px;display:flex;align-items:center;gap:6px;padding:0 8px 0 9px;font-size:11px;font-weight:700;color:#fff;background:var(--pc);border:0;text-align:left;white-space:nowrap;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.bar.light{color:#132662}
.bar:hover{filter:brightness(1.08);outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bar span em{font-style:normal;font-weight:500;opacity:.85}
.bar i.st{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.bar.light i.st{box-shadow:0 0 0 1.5px rgba(19,38,98,.5)}
.nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--fg);z-index:3;pointer-events:none;opacity:.7}
.empty{padding:40px;text-align:center;color:var(--muted)}
.stage .empty.over{position:absolute;left:0;right:0;top:120px}

table.list{border-collapse:collapse;width:100%;min-width:1100px;font-size:12px}
table.list th{position:sticky;top:0;background:var(--midnight);color:var(--bg);text-align:left;padding:8px 10px;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;z-index:2}
:root[data-theme="dark"] table.list th{background:#263561;color:#EEF2FA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.list th{background:#263561;color:#EEF2FA}}
table.list td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:var(--surface-2)}
table.list tr:nth-child(even) td{background:var(--surface)}
table.list .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--sc)}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:6px;vertical-align:middle}

.scrim{position:fixed;inset:0;background:rgba(5,20,43,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer header h2{font-family:var(--font-display);font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.drawer header .x{border:0;background:transparent;font-size:22px;color:var(--muted);line-height:1;padding:4px 8px;border-radius:6px}
.drawer header .x:hover{background:var(--surface-2)}
.drawer .body{flex:1;overflow:auto;padding:14px 18px 24px}
.drawer footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.drawer footer .spacer{flex:1}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-family:var(--font-display);font-weight:700;color:var(--fg);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;padding:0;display:flex;align-items:center;gap:10px;width:100%}
legend .spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.f textarea.copy{min-height:170px;font-family:var(--font-body);line-height:1.5}
.f .cnt{font-size:11px;color:var(--muted);text-align:right}
table.perf{width:100%;border-collapse:collapse;font-size:12px}
table.perf th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
table.perf td{padding:4px 6px;border-bottom:1px solid var(--line)}
table.perf td.m{font-weight:600;color:var(--fg);width:45%}
table.perf input{width:100%;padding:5px 7px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
table.perf td.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;color:var(--fg)}
.hint{font-size:11px;color:var(--muted)}
.pbtn{position:absolute;width:18px;height:18px;border-radius:50%;border:0;background:#fff;color:#132662;font-family:var(--font-display);font-weight:800;font-size:11px;line-height:18px;padding:0;text-align:center;box-shadow:0 0 0 1.5px rgba(19,38,98,.35);z-index:2}
.pbtn:hover{background:var(--accent);color:#fff;box-shadow:0 0 0 1.5px #fff}
.bar.haspv{padding-right:30px}
.pkey{display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff;color:#132662;font-family:var(--font-display);font-weight:800;font-size:9px;line-height:14px;text-align:center;box-shadow:0 0 0 1.5px rgba(19,38,98,.5)}
.cal-row{position:relative;min-width:0}
.cal-row .cal-post.haspv{padding-right:30px}
.cal-row .pbtn{right:3px;top:50%;transform:translateY(-50%)}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.assetbox{border:1px dashed var(--line-strong);border-radius:8px;padding:10px;display:flex;gap:12px;align-items:center;background:var(--surface)}
.assetbox img{width:120px;height:80px;object-fit:cover;border-radius:6px;flex:none;background:#fff}
.assetbox .fileicon{width:120px;height:80px;border-radius:6px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);flex:none;letter-spacing:.06em}
.assetbox .meta{flex:1;min-width:0;font-size:12px}
.assetbox .meta b{display:block;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assetbox .ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* LinkedIn post preview: deliberately fixed light styling, it mocks the LinkedIn feed */
.li-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 16px}
.li-scrim{position:fixed;inset:0;background:rgba(5,20,43,.55);z-index:49}
.li-col{width:min(555px,100%);display:flex;flex-direction:column;gap:10px}
.li-bar{display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:12px}
.li-bar .btn{background:#fff;color:#132662;border-color:#fff}
.li-card{background:#fff;color:rgba(0,0,0,.9);border-radius:8px;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.15);overflow:hidden;font-size:14px}
.li-head{display:flex;gap:8px;padding:12px 16px 0;align-items:flex-start}
.li-avatar{width:48px;height:48px;border-radius:4px;background:#fff;border:1px solid #e6e6e6;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.li-avatar img{width:44px;height:auto}
.li-who{flex:1;min-width:0;line-height:1.25}
.li-name{font-weight:600;font-size:14px;color:rgba(0,0,0,.9)}
.li-sub{font-size:12px;color:rgba(0,0,0,.6)}
.li-sub .g{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,.6);vertical-align:-2px;margin-left:2px}
.li-more{color:rgba(0,0,0,.6);font-weight:700;letter-spacing:.1em;padding:0 4px}
.li-body{padding:8px 16px 10px;line-height:1.43;white-space:pre-wrap;word-wrap:break-word}
.li-body .lk{color:#0a66c2;font-weight:600}
.li-body .morebtn{border:0;background:transparent;color:rgba(0,0,0,.6);font:inherit;padding:0;cursor:pointer}
.li-body .morebtn:hover{color:#0a66c2;text-decoration:underline}
.li-media{background:#f3f2f0;border-top:1px solid #eee}
.li-media img{display:block;width:100%;max-height:560px;object-fit:cover}
.li-media .ph{aspect-ratio:1.91/1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(0,0,0,.5);gap:4px;background:linear-gradient(135deg,#eef2f9,#dfe7f5)}
.li-media .ph b{font-size:22px;color:#132662}
.li-media video{display:block;width:100%;max-height:560px;background:#000}
.li-doc{background:#fff}
.li-doc-top{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:rgba(0,0,0,.6);border-bottom:1px solid #eee}
.li-doc-top b{color:rgba(0,0,0,.9);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-doc-stage{position:relative;background:#f3f2f0;display:flex;align-items:center;justify-content:center;min-height:200px}
.li-doc-stage canvas{display:block;max-width:100%;height:auto;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.li-doc-stage .arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:rgba(0,0,0,.75);font-size:22px;line-height:36px;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
.li-doc-stage .arrow.prev{left:10px}.li-doc-stage .arrow.next{right:10px}
.li-doc-stage .arrow:disabled{opacity:.3;cursor:default}
.li-doc-nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 12px;font-size:12px;color:rgba(0,0,0,.6);border-top:1px solid #eee}
.li-doc-nav .dots{display:flex;gap:4px}
.li-doc-nav .dots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.25)}
.li-doc-nav .dots i.on{background:#0a66c2}
.li-doc .loading{padding:40px;color:rgba(0,0,0,.5);font-size:13px}
.li-link{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#f3f2f0;border-top:1px solid #eee;text-decoration:none;color:inherit}
.li-link .dom{font-size:12px;color:rgba(0,0,0,.6)}
.li-link b{display:block;font-size:14px}
.li-social{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:12px;color:rgba(0,0,0,.6);border-bottom:1px solid #e8e8e8}
.li-react{display:inline-flex;align-items:center;gap:6px}
.li-react i{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:-6px;border:1.5px solid #fff}
.li-actions{display:flex;justify-content:space-around;padding:4px 8px}
.li-actions span{display:inline-flex;align-items:center;gap:6px;padding:10px 8px;font-weight:600;font-size:14px;color:rgba(0,0,0,.6)}
.li-actions svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.confirm{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--bad) 10%,var(--bg));border:1px solid var(--bad);padding:8px 10px;border-radius:8px;width:100%}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px}
.prow input[type="color"]{width:30px;height:30px;border:1px solid var(--line-strong);border-radius:6px;padding:0;background:transparent}
.prow input[type="text"]{padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.prow .meta{display:grid;gap:5px;margin-top:5px}
.prow .meta input{font-size:12px}
.prow .ops{display:flex;gap:2px}
.prow .ops button{border:0;background:transparent;padding:4px 6px;border-radius:5px;color:var(--muted)}
.prow .ops button:hover{background:var(--surface-2);color:var(--fg)}
.ov h3{font-family:var(--font-display);font-size:14px;color:var(--fg);margin:14px 0 6px}
.ov ul{margin:0;padding-left:18px}
.ov .gov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ov .gov div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.ov .gov b{display:block;color:var(--fg);margin-bottom:4px;font-family:var(--font-display)}
.ov .gov p{margin:0;white-space:pre-line;font-size:12px}
.ov table{width:100%;border-collapse:collapse;font-size:12px}
.ov td,.ov th{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.ov th{font-size:11px;color:var(--muted)}
.pv-scrim{position:fixed;inset:0;background:rgba(5,20,43,.55);z-index:50}
.pv-wrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--bg);border-radius:12px;box-shadow:var(--shadow);z-index:51;overflow:hidden}
.pv-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--fg)}
.pv-bar span{flex:1;min-width:0}
.pv-bar .x{border:0;background:transparent;font-size:22px;color:var(--muted);line-height:1;padding:2px 8px;border-radius:6px}
.pv-body{overflow:auto;padding:16px}
.pv-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:600;font-size:12px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
@media (max-width:720px){
  .top .logo{height:32px}
  .tl-label{font-size:13px;padding:6px 8px}
  .ctl input[type="search"]{width:120px}
  .grid3{grid-template-columns:1fr 1fr}
  .ov .gov{grid-template-columns:1fr}
}
</style>

anced Operations"},{"id":"peopleculture","name":"People & Culture","color":"#D91C59","purpose":"Strengthen employer brand, resonate","example":"Employee stories, recognition, events, careers","ambition":"Resonate Culture, Brand"},{"id":"sustainability","name":"Sustainability","color":"#1F9D55","purpose":"Prove our environmental and social commitments","example":"Carbon data, material innovation, ESG progress, certifications","ambition":"Brand, Balanced Operations, Resonate Culture"}],"overview":{"objectives":["Support commercial growth by increasing brand awareness, generating demand and showcasing the breadth of our capabilities.","Strengthen employer brand by positioning Brand Services as an attractive place to work through authentic people-led storytelling.","Provide a consistent corporate narrative across all business units, reducing duplication and confusion.","Create clear governance, ownership and editorial standards while allowing local teams to contribute."],"governance":[{"area":"Content Owners","details":"Jodie Forde, John Cornfield"},{"area":"Content Sponsors","details":"Marianne Descamps, Simon Rozee"}]},"items":[{"id":"p202610120","date":"2026-10-12","time":"2pm GMT","channel":"Brand Services","campaign":"PBS Launch","pillar":"companynews","format":"Carousel","objective":"Awareness","audience":"All Followers","title":"PBS Launch","copy":"You've followed us as Paragon Global Brands.\nHere's who you'll be seeing from today. ↓\nOver the past year, our specialist businesses have come together behind the scenes as one connected team. Strategy, creative, production, fulfilment and measurement, working as one system.\nToday, that team has a name of its own: Paragon Brand Services.\nSame people. Same expertise. Now one partner from brief to shelf, across 29 countries.\nThis page is where you'll find us, and all of our services, from now on. Stay connected, and come and see the whole of us on our new website: paragonbrandservices.com\n#ParagonBrandServices #MarketingThatMoves","link":"PBS Website","asset":"TBC - with Beth","owner":"Jodie","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null},{"id":"p202610131","date":"2026-10-13","time":"11:00","channel":"Brand Services","campaign":"Global ReBrands","pillar":"gtm","format":"","objective":"","audience":"All Followers","title":"GTM Rebrands","copy":"Clients often plan a global rebrand around a 6-month timeline. Then reality arrives: permit approvals, landlord sign-off, manufacturing lead times, dozens of local systems that don't move on your schedule.\nWe've seen a single building permit take 15 months because of local hurricane legislation. Combine that with a 12-month IPO deadline and you have a genuine problem.\nBring an execution partner in early. Within a few minutes of reviewing the plans, we can give you a realistic timeline, phased around permitting, landlord cycles and logistics.\nWant the full breakdown of the five traps that catch most rebrands out? Read the Execution Gap. Link below.","link":"","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null},{"id":"p202610142","date":"2026-10-14","time":"11am GMT","channel":"Brand Services","campaign":"POPAI Award","pillar":"companynews","format":"Single image","objective":"Recognition","audience":"All Followers","title":"TBC - with Austeja","copy":"TBC - with Austeja","link":"PBS Website","asset":"TBC - with Beth","owner":"Austeja","approver":"Mitch / Marianne","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null},{"id":"p202610153","date":"2026-10-15","time":"11:00","channel":"Brand Services","campaign":"Procurement 10 Questions Q1","pillar":"thoughtleadership","format":"Carousel","objective":"","audience":"All Followers","title":"10 Questions Thought Leadership","copy":"At ProcureCon 2026 we hosted a roundtable with procurement leaders on one topic: the ten questions every procurement leader is secretly asking. Not the questions in the board paper. The ones underneath.We gathered them over months of conversations across retail, FMCG, financial services and hospitality, then asked the room to rank them. Three came out well ahead: AI, risk and cost. Here’s question one. The one the room ranked hottest.\n\nRead more about the 10 questions: [link]","link":"https://10procuremenquestions.netlify.app/","asset":"https://paragoncccom.sharepoint.com/:b:/s/PBSMarketingPlannerContent/IQBv_5ge7KBdRbSvyhqvGU1DAZNLr57i-50MNcGN7e9H5xU?e=EYqDdG","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null},{"id":"p202610164","date":"2026-10-16","time":"11am GMT","channel":"Brand Services","campaign":"Recruit/Testimonials","pillar":"peopleculture","format":"Carousel","objective":"Recruitment","audience":"All Followers","title":"Big ambitions. Great people. Exciting opportunities. 🚀","copy":"The questions came from months of conversations with procurement leaders across retail, FMCG, financial services and hospitality. They’re the questions that sit underneath the ones in the board paper. We put them to the room and asked the leaders present to rank them by how hard each one is being felt.","link":"mailto:florent.orsini@paragon-cc.fr","asset":"Recruitment - Oct 16","owner":"Jodie","approver":"Marianne / Florent","status":"Approved","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null},{"id":"p10qq2","date":"2026-10-22","time":"11:00","channel":"Brand Services","campaign":"Procurement 10 Questions Q2","pillar":"thoughtleadership","format":"Carousel","objective":"Lead generation","audience":"All Followers","title":"10 Questions Q2: Risk & resilience","copy":"Question two from our ProcureCon 2026 roundtable. The second of the three that ran well ahead of the rest.\nAm I managing risk, or just managing the appearance of managing it?\nRisk used to mean continuity and cost. Now geopolitics, regulation, cyber and the financial health of suppliers all sit on the same agenda. Most of it moves faster than the quarterly review that’s meant to catch it.\nThat’s why a tidy dashboard can be the most dangerous thing in the room. No red flags starts to feel like no risk.\nThe procurement leaders we spoke to weren’t short of reporting. They were short of early warning, especially on single points of failure.\nCaught early, risk is value protected. Caught late, it’s a P&L event with your name on it.\nSwipe through for what the room said. Comment “review” and we’ll set up a supplier risk review, or read all ten questions at paragonbrandservices.com","link":"https://10procuremenquestions.netlify.app/","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null,"assetFile":{"name":"PBS_10Q_Q2_LinkedIn_carousel.pdf","type":"application/pdf","size":166280,"src":"assets/PBS_10Q_Q2_LinkedIn_carousel.pdf"}},{"id":"prebrand2","date":"2026-10-27","time":"11:00","channel":"Brand Services","campaign":"Global ReBrands","pillar":"gtm","format":"Carousel","objective":"Lead generation","audience":"All Followers","title":"Rebrand killer 2 of 5: The Audit Trap","copy":"One client refused to pay €200,000 for a professional physical asset survey. An internal facilities manager did the count instead.\nThe result was a 30% error rate. Signs made to the wrong size. Corrected items shipped twice. Whole buildings missing from the count.\nPutting it right cost €650,000. More than three times the survey it replaced.\nA proper audit, run by your execution partner, gives you one source of truth for every asset’s size, material, location and condition. It’s the step that gives you cost certainty for everything that follows, so make it non-negotiable.\nThat’s two of the five traps. The rest are in the Execution Gap. Link below.","link":"","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null,"assetFile":{"name":"PBS_Post2_Audit_Trap_Carousel.pdf","type":"application/pdf","size":121458,"src":"assets/PBS_Post2_Audit_Trap_Carousel.pdf"}},{"id":"p10qq3","date":"2026-10-29","time":"11:00","channel":"Brand Services","campaign":"Procurement 10 Questions Q3","pillar":"thoughtleadership","format":"Carousel","objective":"Lead generation","audience":"All Followers","title":"10 Questions Q3: Cost & value","copy":"Question three, and the last of the three that dominated the room at ProcureCon 2026.\nWhen the cuts come, does my value story protect me, or make me the easiest line to delete?\nSavings is the most fragile number procurement reports. A headline saving can vanish into rework, rush fees and quality trade-offs that never make the same slide.\nAnd if cost reduction is all finance sees you doing, you’re the first line they cut.\nThe stronger position talks the business’s language: speed to shelf, fewer write-offs and a brand that looks the same in every store. That means total cost of ownership across print, digital and print-on-demand, not unit price.\nIt’s how we helped John Lewis cut costs by 66%.\nComment “TCO” to book a total cost of ownership working session, or read all ten questions at paragonbrandservices.com","link":"https://10procuremenquestions.netlify.app/","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null,"assetFile":{"name":"PBS_10Q_Q3_LinkedIn_carousel.pdf","type":"application/pdf","size":167362,"src":"assets/PBS_10Q_Q3_LinkedIn_carousel.pdf"}},{"id":"p10qq4","date":"2026-11-05","time":"11:00","channel":"Brand Services","campaign":"Procurement 10 Questions Q4","pillar":"thoughtleadership","format":"Carousel","objective":"Lead generation","audience":"All Followers","title":"10 Questions Q4: Technology & data","copy":"The three dominant questions are done. Question four leads the high-priority tier, and it follows AI everywhere.\nDid our technology actually fix the process, or did we just digitise the old one?\nPlenty of platforms get bought on the promise of transformation, then automate the same broken process at higher speed. The mess still arrives. It just arrives faster.\nUnderneath sits a data problem. Most data isn’t ready for the AI layered on top of it: disconnected systems, no shared definitions.\nAnalytics amplify what they’re given. They don’t repair it.\nSo fix the process and clean the data first. Then the technology compounds the gains, not the errors. That’s the principle behind RetailOS, now live across 5,000+ retail locations.\nComment “checklist” for our data readiness checklist, or read all ten questions at paragonbrandservices.com","link":"https://10procuremenquestions.netlify.app/","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null,"assetFile":{"name":"PBS_10Q_Q4_LinkedIn_carousel.pdf","type":"application/pdf","size":167334,"src":"assets/PBS_10Q_Q4_LinkedIn_carousel.pdf"}},{"id":"prebrand3","date":"2026-11-10","time":"11:00","channel":"Brand Services","campaign":"Global ReBrands","pillar":"gtm","format":"Carousel","objective":"Lead generation","audience":"All Followers","title":"Rebrand killer 3 of 5: The Making Good Trap","copy":"Take a 20-letter name off a reception wall. Put a three-letter one up in its place. Simple, on paper.\nWhat’s left behind isn’t. Ghosting, drill holes and a wall that no longer matches. The new sign doesn’t cover the old footprint, so the whole wall, and often the whole room, gets repainted.\nOne sign swap becomes a five-figure job nobody budgeted for. Now multiply that across every reception, every site, every country.\nScope making good as its own line item. And when a long name is being replaced by a shorter one, design the new sign with a built-in back panel sized to the old footprint from day one.\nThree traps down, two to go. All five are in the Execution Gap. Link below.","link":"","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null,"assetFile":{"name":"PBS_Post3_Making_Good_Trap_Carousel.pdf","type":"application/pdf","size":121326,"src":"assets/PBS_Post3_Making_Good_Trap_Carousel.pdf"}},{"id":"p10qq5","date":"2026-11-12","time":"11:00","channel":"Brand Services","campaign":"Procurement 10 Questions Q5","pillar":"thoughtleadership","format":"Carousel","objective":"Lead generation","audience":"All Followers","title":"10 Questions Q5: Consolidation & risk","copy":"Question five. Every rise in print, paper and logistics costs brings it back.\nShould I consolidate, without creating a single point of failure?\nThe case for consolidation is clear: fewer suppliers, simpler operations, more buying power.\nBut every supplier you remove is also a fallback you remove. Hand the whole flow to one partner and a single failure can stall everything at once.\nSo the real question isn’t one partner or many. It’s what sits behind the one. Is it a governed network that spreads the risk, or one place that stacks it?\nWe run €560m+ of production spend open-book, through a vetted partner network, so you can see where the work goes and what it costs.\nComment “test” for our one-page integrator test, or read all ten questions at paragonbrandservices.com","link":"https://10procuremenquestions.netlify.app/","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null,"assetFile":{"name":"PBS_10Q_Q5_LinkedIn_carousel.pdf","type":"application/pdf","size":165598,"src":"assets/PBS_10Q_Q5_LinkedIn_carousel.pdf"}},{"id":"prebrand4","date":"2026-11-24","time":"11:00","channel":"Brand Services","campaign":"Global ReBrands","pillar":"gtm","format":"Carousel","objective":"Lead generation","audience":"All Followers","title":"Rebrand killer 4 of 5: The Local Nuance Trap","copy":"A design that works on a screen in London can fail somewhere else. Three examples from our own programmes:\nSecurity. In parts of South America and Africa, vehicle branding has to be magnetic so drivers can remove it after hours and avoid being targeted.\nTheft. In certain regions of Asia, an illuminated metal sign gets stolen and melted for scrap within days. The answer is a visually identical, materially worthless alternative.\nCompliance. An illuminated sign near a major port like Genoa can interfere with navigation signals. That’s a separate approval with the maritime authorities, not just the city.\nWork with a partner that has people on the ground in every key market. Local knowledge before manufacture protects the budget and the brand.\nFour traps down, one to go. Read the Execution Gap. Link below.","link":"","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null,"assetFile":{"name":"PBS_Post4_Local_Nuance_Trap_Carousel.pdf","type":"application/pdf","size":122161,"src":"assets/PBS_Post4_Local_Nuance_Trap_Carousel.pdf"}},{"id":"prebrand5","date":"2026-12-08","time":"11:00","channel":"Brand Services","campaign":"Global ReBrands","pillar":"gtm","format":"Carousel","objective":"Lead generation","audience":"All Followers","title":"Rebrand killer 5 of 5: The Incomplete Toolkit Trap","copy":"Brand guidelines often die in production because they lack technical depth. We’ve seen it all.\nRGB black specified for print. An entire brand book built in Google Docs, by an agency paid millions. No material specifications. No rule for illuminated versus non-illuminated signage.\nWithout clear standards, each market interprets the brand its own way. The result is a brand shaped by local conditions, not by the intended identity.\nBring in an implementation specialist who can step upstream, stress test the brand book against production reality and make sure the toolkit includes material specifications, not just hex codes.\nThat’s all five traps. How to avoid each one is in the Execution Gap. Link below.","link":"","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null,"assetFile":{"name":"PBS_Post5_Incomplete_Toolkit_Trap_Carousel.pdf","type":"application/pdf","size":121631,"src":"assets/PBS_Post5_Incomplete_Toolkit_Trap_Carousel.pdf"}},{"id":"prebrand6","date":"2026-12-22","time":"11:00","channel":"Brand Services","campaign":"Global ReBrands","pillar":"gtm","format":"Carousel","objective":"Lead generation","audience":"All Followers","title":"Proof point: Accelleron, 120 sites, 87 countries, one partner","copy":"When ABB’s turbocharging business became Accelleron, the new brand had to land on buildings, offices, vehicles and merchandise across 120 sites in 87 countries. Consistently. Everywhere.\nIt started with a virtual survey across 80 countries and a brand book for every site, signed off by the local manager and the client before anything was made.\nThen the hard part. We closed part of one of Europe’s busiest ports for two hours, with three cranes working together, to lift the headquarters sign. In Rotterdam a roof membrane issue meant building an extra gantry first.\nThe outcome: 50,000 signs, 100 vehicles, 100% of contract KPIs met. One partner, one standard.\n“Paragon are fantastic. You never give up and find a solution to every problem.” That’s the rebrand agency lead on the programme.\nRebrand on the roadmap? Book a 20-minute discovery call. Link below.","link":"","asset":"","owner":"John C","approver":"Simon","status":"In Draft","impressions":null,"engagements":null,"engagementRate":null,"clicks":null,"followers":null,"assetFile":{"name":"PBS_Post6_Accelleron_Carousel.pdf","type":"application/pdf","size":124360,"src":"assets/PBS_Post6_Accelleron_Carousel.pdf"}}]}</script>
<script>
(function(){
'use strict';
const LOGO = document.querySelector('.top .logo').getAttribute('src');
const DATA_PATH = 'data/plan.json';
const LS_DATA = 'pbs-linkedin-calendar-data';
const LS_VIEW = 'pbs-linkedin-calendar-view';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const UNASSIGNED = {id:'',name:'Unassigned',color:'#8C97B5',purpose:''};
const STATUS_COLOR = {'In Draft':'#F5B800','Under Review':'#FF7A00','Approved':'#8FD86A','Published':'#1F9D55','Postponed':'#EC8EAC'};
const PALETTE = ['#132662','#005FFF','#4087FF','#D91C59','#1F9D55','#59D1C7','#EC8EAC','#05142B','#F5B800','#8FD86A'];
const METRICS = [['impressions','Impressions'],['engagements','Engagements'],['clicks','Clicks'],['followers','Followers gained']];
// The columns of the source calendar, in order. Export writes exactly these; import reads them.
const COLS = [['date','Publish date'],['time','Publish time'],['channel','LinkedIn channel'],['campaign','Campaign'],['pillar','Content pillar'],['format','Format'],['objective','Objective'],['audience','Audience'],['title','Topic / working title'],['copy','Post copy'],['link','Destination link'],['asset','Asset'],['owner','Owner'],['approver','Approver'],['status','Status'],['impressions','Impressions'],['engagements','Engagements'],['engagementRate','Engagement rate'],['clicks','Clicks'],['followers','Followers gained']];

let plan = null;
let view = {mode:'calendar', start:'2026-10', len:1, wstart:'', weeks:4, channel:'', status:'', owner:'', q:''};
let artifactCap = null, downloadsCap = null, assetsCap = null, capsReady = false;
let saveMode = 'local';

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'p' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3);
function pd(s){ if(!s) return null; const [y,m,d] = String(s).slice(0,10).split('-').map(Number); if(!y||!m) return null; return new Date(y, m-1, d||1); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ym(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((b-a)/864e5); }
function fmtShort(d){ return d.getDate()+' '+MONTHS[d.getMonth()]; }
function fmtMon(d){ return MONTHS[d.getMonth()]+' '+String(d.getFullYear()).slice(2); }
function fmtLong(s){ const d=pd(s); return d? d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear() : ''; }
function fmtDay(s){ const d=pd(s); return d? DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()] : ''; }
function fmtNum(n){ return (n==null||n==='')?'':Number(n).toLocaleString('en-GB'); }
function luminance(hex){ const c=hex.replace('#',''); const r=parseInt(c.slice(0,2),16)/255,g=parseInt(c.slice(2,4),16)/255,b=parseInt(c.slice(4,6),16)/255; return 0.2126*r+0.7152*g+0.0722*b; }
function isLight(hex){ return luminance(hex) > 0.55; }
function mondayOnOrBefore(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function today(){ const t=new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function statusColor(s){ if(STATUS_COLOR[s]) return STATUS_COLOR[s]; let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }
function pillarOf(id){ return plan.pillars.find(p=>p.id===id) || null; }
function engRate(it){ if(it.engagementRate!=null && it.engagementRate!=='') return Number(it.engagementRate); if(it.engagements!=null && it.impressions) return it.engagements/it.impressions; return null; }
function pctText(r){ return r==null?'':(r*100).toFixed(2)+'%'; }
function blankItemRaw(d){ return {id:uid(), date:'', time:'', channel:'', campaign:'', pillar:'', format:'', objective:'', audience:'', title:'', copy:'', link:'', asset:'', owner:'', approver:'', status:((d.lists&&d.lists.statuses&&d.lists.statuses[0])||'In Draft'), assetFile:null, impressions:null, engagements:null, engagementRate:null, clicks:null, followers:null}; }
function blankItem(pillar){ const it=blankItemRaw(plan); it.date=iso(today()); it.channel=plan.lists.channels[0]||''; it.pillar=pillar||(plan.pillars[0]?plan.pillars[0].id:''); return it; }
function normalise(data){
  const d = Object.assign({version:2, title:'LinkedIn Content Calendar', pillars:[], items:[], lists:{}, overview:{}}, data||{});
  d.lists = Object.assign({channels:[], formats:[], objectives:[], statuses:Object.keys(STATUS_COLOR)}, d.lists||{});
  d.overview = Object.assign({objectives:[], governance:[]}, d.overview||{});
  d.channelMeta = Object.assign({'Brand Services':{display:'Paragon Brand Services', followers:'26,553 followers'}}, d.channelMeta||{});
  d.pillars = (d.pillars||[]).map(p=>Object.assign({purpose:'',example:'',ambition:''}, p));
  d.items = (d.items||[]).map(it => { const o=Object.assign(blankItemRaw(d), it); ['impressions','engagements','clicks','followers','engagementRate'].forEach(k=>{ o[k]=(o[k]===''||o[k]==null||isNaN(Number(o[k])))?null:Number(o[k]); }); return o; });
  return d;
}
function toast(msg, ms=2600){ const h=$('#toastHost'); h.innerHTML=''; const t=document.createElement('div'); t.className='toast'; t.textContent=msg; h.appendChild(t); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.remove();}, ms); }

/* ---------- persistence ---------- */
function dataStamp(){ const s=plan&&plan.basedOn; if(!s) return ''; const d=new Date(s); if(isNaN(d)) return ''; return ' · data '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function setChip(kind, text){ const c=$('#saveChip'); c.className='chip'+(kind==='warn'?' warn':kind==='err'?' err':''); c.querySelector('span').textContent=text+dataStamp(); }
function readLocal(){ try{ const s=localStorage.getItem(LS_DATA); return s? JSON.parse(s): null; }catch(e){ return null; } }
function writeLocal(d){ try{ localStorage.setItem(LS_DATA, JSON.stringify(d)); return true; }catch(e){ return false; } }
async function loadPlan(){
  let base=null;
  try{ const r=await fetch(DATA_PATH, {cache:'no-store'}); if(r.ok) base=await r.json(); }catch(e){}
  if(!base){ try{ base=JSON.parse($('#seed').textContent); }catch(e){ base={pillars:[],items:[]}; } }
  // The shared file is the source of truth. A browser copy is used only when it was made from this exact version of the file
  // (so unsaved edits on a static host survive a reload) and never when the file has moved on.
  const local=readLocal(); let fileStamp=base.savedAt||'';
  if(local && local.basedOn && local.basedOn===fileStamp && local.savedAt>fileStamp) base=local;
  plan=normalise(base); plan.basedOn=fileStamp;
  try{ const v=JSON.parse(localStorage.getItem(LS_VIEW)||'null'); if(v) Object.assign(view, v, {q:''}); }catch(e){}
  if(!view.wstart) view.wstart=iso(mondayOnOrBefore(today()));
  if(view.mode==='monthly') view.mode='calendar';
}
async function savePlan(){
  plan.savedAt=new Date().toISOString();
  const pub=Object.assign({}, plan); delete pub.basedOn; const json=JSON.stringify(pub, null, 1);
  writeLocal(plan);
  if(artifactCap && saveMode!=='readonly'){
    setChip('warn','Saving…');
    try{ await artifactCap.publish({[DATA_PATH]: {content: json, contentType:'application/json'}}); saveMode='artifact'; plan.basedOn=plan.savedAt; writeLocal(plan); setChip('', 'Saved to the shared calendar'); return true; }
    catch(e){ const code=e&&e.code;
      if(code==='conflict'){ setChip('warn','Someone else saved first. Reloading…'); return false; }
      if(['not_writer','not_granted','not_declared','capability_disabled','capability_removed'].includes(code)){ saveMode='readonly'; setChip('warn','Read-only view: changes stay on this device'); return false; }
      setChip('err','Save failed ('+(code||'error')+'). Kept on this device'); return false; }
  }
  setChip(saveMode==='readonly'?'warn':'', saveMode==='readonly'?'Read-only view: changes stay on this device':'Saved on this device');
  return true;
}
function saveView(){ try{ localStorage.setItem(LS_VIEW, JSON.stringify({mode:view.mode,start:view.start,len:view.len,wstart:view.wstart,weeks:view.weeks,channel:view.channel,status:view.status,owner:view.owner})); }catch(e){} }

/* ---------- range and filters ---------- */
function rangeDates(){ if(view.mode==='weekly'){ const s=pd(view.wstart)||mondayOnOrBefore(today()); return {s, e:addDays(s, 7*Number(view.weeks||4))}; } const s=pd(view.start+'-01'); return {s, e:addMonths(s, Number(view.len))}; }
// Weekly columns are working days, Monday to Friday. A week gets one extra "Sat / Sun" column only when a post falls on its weekend.
function columns(){ const {s,e}=rangeDates(); const cols=[];
  if(view.mode==='weekly'){ for(let w=new Date(s); w<e; w=addDays(w,7)){ const group='w/c '+fmtShort(w)+' '+w.getFullYear(); for(let i=0;i<5;i++){ const d=addDays(w,i); cols.push({s:d, e:addDays(d,1), label:DAYS[d.getDay()]+' '+d.getDate(), group}); } const sat=addDays(w,5), nxt=addDays(w,7); if(plan.items.some(it=>{ const d=pd(it.date); return d && d>=sat && d<nxt; })) cols.push({s:sat, e:nxt, label:'Sat / Sun', group, wknd:true}); } }
  else { for(let d=new Date(s); d<e; d=addMonths(d,1)) cols.push({s:new Date(d), e:addMonths(d,1), label:fmtMon(d), month:ym(d)}); }
  return cols; }
function colIndexFor(d, cols){ return cols.findIndex(c=>d>=c.s && d<c.e); }
function matchesFilters(it){ const q=view.q.trim().toLowerCase();
  if(view.channel && it.channel!==view.channel) return false; if(view.status && it.status!==view.status) return false; if(view.owner && it.owner!==view.owner) return false;
  if(q){ const hay=[it.title,it.campaign,it.copy,it.owner,it.approver,it.format,it.objective,it.audience,it.channel].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
  return true; }
function visibleItems(){ const {s,e}=rangeDates(); return plan.items.filter(it=>{ const a=pd(it.date); if(!a) return false; if(a<s||a>=e) return false; return matchesFilters(it); }); }

/* ---------- render ---------- */
function renderChrome(){
  $('#planTitle').textContent = plan.title || 'LinkedIn Content Calendar';
  const {s:rs,e:re}=rangeDates(); const lastM=addMonths(re,-1);
  $('#rangeLabel').textContent = view.mode==='weekly' ? ('Working week, w/c '+fmtShort(rs)+' '+rs.getFullYear()+(Number(view.weeks)>1?' to w/c '+fmtShort(addDays(re,-7))+' '+addDays(re,-7).getFullYear():'')) : (MONTHS[rs.getMonth()]+' '+rs.getFullYear()+(Number(view.len)>1?' to '+MONTHS[lastM.getMonth()]+' '+lastM.getFullYear():''));
  const sel=$('#rangeStart'), selL=$('#rangeLen'); const t=today();
  if(view.mode==='weekly'){ const base=mondayOnOrBefore(t); const opts=[]; for(let i=-8;i<=30;i++) opts.push(iso(addDays(base,7*i))); if(!opts.includes(view.wstart)) opts.push(view.wstart); opts.sort();
    sel.innerHTML=opts.map(v=>{ const d=pd(v); return '<option value="'+v+'"'+(v===view.wstart?' selected':'')+'>w/c '+fmtShort(d)+' '+d.getFullYear()+'</option>'; }).join('');
    selL.innerHTML=[1,2,4,8,13].map(n=>'<option value="'+n+'"'+(n===Number(view.weeks)?' selected':'')+'>'+n+' week'+(n>1?'s':'')+'</option>').join(''); }
  else { const opts=[]; for(let i=-12;i<=18;i++){ opts.push(ym(addMonths(t,i))); } if(!opts.includes(view.start)) opts.push(view.start); opts.sort();
    sel.innerHTML=opts.map(v=>{ const d=pd(v+'-01'); return '<option value="'+v+'"'+(v===view.start?' selected':'')+'>'+MONTHS[d.getMonth()]+' '+d.getFullYear()+'</option>'; }).join('');

// Work out what to show in the feed mock: the attached file first, then a file path or link typed in Asset.
function mediaOf(v){ const af=v.assetFile; if(af && af.src){ const ty=af.type||''; if(/^image\//.test(ty)||/^data:image/.test(af.src)) return {kind:'image',src:af.src,name:af.name}; if(/^video\//.test(ty)||/^data:video/.test(af.src)) return {kind:'video',src:af.src,name:af.name}; if(/pdf/.test(ty)||/^data:application\/pdf/.test(af.src)) return {kind:'pdf',src:af.src,name:af.name}; }
  const a=(v.asset||'').trim(); const base=a.split(/[?#]/)[0]; if(/\.(png|jpe?g|gif|webp)$/i.test(base)) return {kind:'image',src:a,name:base.split('/').pop()}; if(/\.(mp4|webm)$/i.test(base)) return {kind:'video',src:a,name:base.split('/').pop()}; if(/\.pdf$/i.test(base)) return {kind:'pdf',src:a,name:base.split('/').pop()};
  if(af) return {kind:'file',src:null,name:af.name}; return null; }
async function ensurePdfJs(){ if(window.pdfjsLib && window.pdfjsWorker) return window.pdfjsLib;
  const load=u=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=u; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  const tryPair=async (a,b)=>{ await load(a); await load(b); };
  try{ await tryPair('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'); }
  catch(e){ try{ await tryPair('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'); }catch(e2){} }
  return window.pdfjsLib||null; }
function pdfSource(src){ if(/^data:/.test(src)){ const b=atob(src.split(',')[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return {data:u}; } return {url:src}; }
// Document carousel, the way LinkedIn shows a PDF: one page at a time with arrows and a page counter.
async function mountPdfCarousel(el, src, name){
  el.innerHTML='<div class="li-doc-top"><b>'+esc(name||'Document')+'</b><span>Loading…</span></div><div class="li-doc-stage"><div class="loading">Loading document…</div></div>';
  const lib=await ensurePdfJs(); if(!lib){ el.querySelector('.loading').textContent='Couldn’t load the PDF viewer (no internet access to the CDN).'; return; }
  let doc; try{ doc=await lib.getDocument(pdfSource(src)).promise; }catch(e){ el.querySelector('.loading').textContent='Couldn’t open this PDF.'; return; }
  const n=doc.numPages; let cur=1; const cache={};
  el.innerHTML='<div class="li-doc-top"><b>'+esc(name||'Document')+'</b><span>'+n+' page'+(n>1?'s':'')+'</span></div><div class="li-doc-stage"><button type="button" class="arrow prev" aria-label="Previous page">‹</button><canvas></canvas><button type="button" class="arrow next" aria-label="Next page">›</button></div><div class="li-doc-nav"><span class="pg"></span><span class="dots">'+Array.from({length:Math.min(n,12)},()=>'<i></i>').join('')+'</span></div>';
  const stage=el.querySelector('.li-doc-stage'), canvas=el.querySelector('canvas'), prev=el.querySelector('.prev'), next=el.querySelector('.next'), pg=el.querySelector('.pg'), dots=el.querySelectorAll('.dots i');
  const show=async ()=>{ prev.disabled=cur<=1; next.disabled=cur>=n; pg.textContent=cur+' / '+n; dots.forEach((d,i)=>d.classList.toggle('on', i===Math.min(cur-1, dots.length-1)));
    if(!cache[cur]){ const page=await doc.getPage(cur); const vp0=page.getViewport({scale:1}); const target=Math.min(1100, (stage.clientWidth||520)*2); const scale=target/vp0.width; const vp=page.getViewport({scale}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise; cache[cur]=c; }
    const c=cache[cur]; canvas.width=c.width; canvas.height=c.height; canvas.getContext('2d').drawImage(c,0,0); canvas.style.width='100%'; };
  prev.onclick=()=>{ if(cur>1){ cur--; show(); } }; next.onclick=()=>{ if(cur<n){ cur++; show(); } };
  el.tabIndex=0; el.addEventListener('keydown', e=>{ if(e.key==='ArrowLeft') prev.click(); if(e.key==='ArrowRight') next.click(); });
  await show();
}
function linkify(text){ return esc(text).replace(/(https?:\/\/[^\s<]+)/g,'<span class="lk">$1</span>').replace(/(^|\s)(#[\p{L}\p{N}_]+)/gu,'$1<span class="lk">$2</span>').replace(/(^|\s)(@[\p{L}\p{N}_.]+)/gu,'$1<span class="lk">$2</span>'); }

    '<div class="li-social"><span class="li-react"><i style="background:#378fe9"></i><i style="background:#df704d"></i><i style="background:#6dae4f"></i>&nbsp;&nbsp;'+(eng||'')+'</span><span>'+(eng?'':'0 comments · 0 reposts')+'</span></div>'+

    '<div class="li-bar"><span>'+copy.length+' characters'+(copy.length>3000?' · over the 3,000 limit':'')+'</span></div></div></div>';
  document.body.appendChild(host);
  const close=()=>{ host.remove(); document.removeEventListener('keydown', onKey); }; const onKey=e=>{ if(e.key==='Escape') close(); }; document.addEventListener('keydown', onKey);
  $('#liClose').onclick=close; $('#liScrim').onclick=close; $('#liWrap').addEventListener('click', e=>{ if(e.target===e.currentTarget) close(); });

async function pdfFirstPageCanvas(src){ const lib=await ensurePdfJs(); if(!lib) return null; const doc=await lib.getDocument(pdfSource(src)).promise; const page=await doc.getPage(1); const vp0=page.getViewport({scale:1}); const scale=900/vp0.width; const vp=page.getViewport({scale}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise; return {canvas:c, pages:doc.numPages}; }
function videoFrameCanvas(src){ return new Promise(resolve=>{ const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='auto'; let done=false; const finish=c=>{ if(!done){ done=true; resolve(c); } }; const timer=setTimeout(()=>finish(null), 6000);
  v.addEventListener('loadeddata', ()=>{ try{ v.currentTime=Math.min(0.5, (v.duration||1)/2); }catch(e){ finish(null); } }); v.addEventListener('seeked', ()=>{ try{ const c=document.createElement('canvas'); c.width=v.videoWidth||640; c.height=v.videoHeight||360; c.getContext('2d').drawImage(v,0,0,c.width,c.height); clearTimeout(timer); finish(c); }catch(e){ finish(null); } }); v.addEventListener('error', ()=>finish(null)); v.src=src; }); }

async function ensureLib(globalName, url){ if(window[globalName]) return window[globalName]; await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=url; s.onload=res; s.onerror=rej; document.head.appendChild(s); }).catch(()=>{}); return window[globalName]; }
async function saveFile(filename, blob){

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

async function exportXlsx(monthStart){
  const mS=monthStart||new Date(today().getFullYear(),today().getMonth(),1), mE=addMonths(mS,1); const monthLabel=MONTHS_LONG[mS.getMonth()]+' '+mS.getFullYear();
  const EX=await ensureLib('ExcelJS','https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js') || await ensureLib('ExcelJS','https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'); if(!EX){ toast('Excel library did not load'); return; }
  const wb=new EX.Workbook(); wb.creator='Paragon Brand Services'; wb.created=new Date();
  const NAVY='FF132662', GREY='FF6B7280', LINE='FFD6DEEB', FONT='Arial';
  const thin={style:'thin',color:{argb:LINE}}; const border={top:thin,left:thin,bottom:thin,right:thin};
  // Every sheet: bold title, italic grey note, blank row, navy header with white centred text and filters, then the data.
  const sheet=(name, title, note, headers, rows, widths, opts={})=>{
    const ws=wb.addWorksheet(name, {views:[{state:'frozen', ySplit:4, xSplit:opts.freezeCols||0}]});
    ws.getCell('A1').value=title; ws.getCell('A1').font={name:FONT,size:14,bold:true,color:{argb:NAVY}};
    ws.getCell('A2').value=note; ws.getCell('A2').font={name:FONT,size:10,italic:true,color:{argb:GREY}};
    ws.getRow(1).height=22; ws.getRow(3).height=8;
    const hr=ws.getRow(4); hr.values=headers; hr.height=30;
    hr.eachCell({includeEmpty:true},(c,i)=>{ if(i>headers.length) return; c.font={name:FONT,size:10,bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; c.alignment={vertical:'middle',horizontal:'center',wrapText:true}; c.border=border; });
    rows.forEach((r,ri)=>{ const row=ws.getRow(5+ri); row.values=r; row.eachCell({includeEmpty:true},(c,i)=>{ if(i>headers.length) return; c.font={name:FONT,size:10}; c.alignment={vertical:'top',wrapText:true}; c.border=border; if(opts.fmt&&opts.fmt[i-1]) c.numFmt=opts.fmt[i-1]; if(opts.center&&opts.center.includes(i-1)) c.alignment={vertical:'top',horizontal:'center',wrapText:true}; }); if(opts.rowHeight) row.height=opts.rowHeight; });
    widths.forEach((w,i)=>{ ws.getColumn(i+1).width=w; });
    if(headers.length>1) ws.autoFilter={from:{row:4,column:1},to:{row:Math.max(4,4+rows.length),column:headers.length}};
    if(opts.after) opts.after(ws);
    return ws; };

function levenshtein(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=[...Array(n+1).keys()]; for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; } return prev[n]; }
function matchPillar(name, pillars){ const n=String(name||'').trim(); if(!n) return ''; const norm=s=>s.toLowerCase().replace(/&/g,'and').replace(/[^a-z]/g,''); const k=norm(n); let p=pillars.find(x=>norm(x.name)===k); if(p) return p.id;
  p=pillars.find(x=>{ const a=norm(x.name); return (a.length>=3 && k.startsWith(a)) || (a.length>3 && (a.startsWith(k)||levenshtein(a,k)<=2)); }); if(p) return p.id;
  const np={id:'pl'+uid(), name:n, color:PALETTE[pillars.length%PALETTE.length], purpose:'', example:'', ambition:''}; pillars.push(np); return np.id; }
function matchList(v, list){ const s=String(v||'').trim(); if(!s) return ''; const hit=list.find(x=>x.toLowerCase()===s.toLowerCase()); return hit||s; }
function sheetToRows(X, ws){ const aoa=X.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}); let hi=aoa.findIndex(r=>r.some(c=>/publish date|working title|topic/i.test(String(c)))); if(hi<0) hi=0; const hdr=aoa[hi].map(h=>String(h).trim()); return aoa.slice(hi+1).map(r=>{ const o={}; hdr.forEach((h,i)=>{ if(h) o[h]=r[i]; }); return o; }); }
async function importExcel(file){
  const X=await ensureLib('XLSX','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); if(!X){ toast('Excel library did not load'); return; }
  const buf=await file.arrayBuffer(); let wb; try{ wb=X.read(buf,{type:'array',cellDates:true}); }catch(e){ toast('Couldn’t read that spreadsheet'); return; }
  const name=wb.SheetNames.find(n=>/content calendar/i.test(n))||wb.SheetNames.find(n=>/calendar|content|plan/i.test(n))||wb.SheetNames[0];
  const rows=sheetToRows(X, wb.Sheets[name]); if(!rows.length){ toast('Sheet “'+name+'” has no rows'); return; }
  const hdrs=Object.keys(rows[0]); const C={};
  const want={date:/^publish date|^date/i, time:/^publish time|^time/i, channel:/channel/i, campaign:/^campaign/i, pillar:/pillar/i, format:/^format/i, objective:/^objective/i, audience:/^audience/i, title:/working title|^topic|^title/i, copy:/post copy|^copy|^body/i, link:/destination|^link|^url/i, asset:/^asset/i, owner:/^owner/i, approver:/^approver/i, status:/^status/i, impressions:/impression/i, engagements:/^engagements?$/i, engagementRate:/engagement rate/i, clicks:/^clicks?/i, followers:/follower/i};
  for(const k in want){ C[k]=hdrs.find(h=>want[k].test(h)); }
  if(!C.title && !C.copy){ toast('No “Topic / working title” column found on sheet “'+name+'”', 5000); return; }
  const lsName=wb.SheetNames.find(n=>/^lists?$/i.test(n)); let lists=null;
  if(lsName){ const la=X.utils.sheet_to_json(wb.Sheets[lsName],{header:1,defval:''}); const lh=(la[0]||[]).map(h=>String(h).toLowerCase()); const colOf=re=>lh.findIndex(h=>re.test(h)); const grab=i=>i<0?[]:[...new Set(la.slice(1).map(r=>String(r[i]||'').trim()).filter(Boolean))]; lists={channels:grab(colOf(/channel/)), formats:grab(colOf(/format/)), objectives:grab(colOf(/objective/)), statuses:grab(colOf(/status/))}; }
  const statuses=(lists&&lists.statuses.length)?lists.statuses:plan.lists.statuses;
  const pillars=plan.pillars.map(p=>Object.assign({},p)); const items=[]; let skipped=0, untitled=0;
  rows.forEach(r=>{ const g=k=>C[k]!=null? r[C[k]] : ''; let title=String(g('title')||'').trim(); const copy=String(g('copy')||'').trim(); const date=excelDate(g('date'));
    const hasContent = title || copy || String(g('campaign')||'').trim();
    if(!hasContent || !date){ if(hasContent) skipped++; return; }
    if(!title){ title=copy.split(/\n/)[0].slice(0,60).trim()+(copy.length>60?'…':''); untitled++; }
    const it=blankItemRaw(plan); it.date=date; it.time=excelTime(g('time')); it.channel=matchList(g('channel'), plan.lists.channels); it.campaign=String(g('campaign')||'').trim(); it.pillar=matchPillar(g('pillar'), pillars);
    it.format=matchList(g('format'), plan.lists.formats); it.objective=matchList(g('objective'), plan.lists.objectives); it.audience=String(g('audience')||'').trim(); it.title=title; it.copy=copy; it.link=String(g('link')||'').trim(); it.asset=String(g('asset')||'').trim(); it.owner=String(g('owner')||'').trim(); it.approver=String(g('approver')||'').trim();
    const st=String(g('status')||'').trim(); it.status = st? matchList(st, statuses) : (statuses[0]||'In Draft');
    it.impressions=numOrNull(g('impressions')); it.engagements=numOrNull(g('engagements')); it.clicks=numOrNull(g('clicks')); it.followers=numOrNull(g('followers')); const er=numOrNull(g('engagementRate')); it.engagementRate = er==null?null:(er>1?er/100:er);
    items.push(it); });
  if(!items.length){ toast('No dated posts found on sheet “'+name+'”', 4000); return; }
  plan.pillars=pillars; plan.items=items; if(lists){ for(const k in lists) if(lists[k].length) plan.lists[k]=lists[k]; }
  render(); await savePlan();
  toast('Imported '+items.length+' posts from “'+name+'”'+(untitled?' ('+untitled+' titled from their copy)':'')+(skipped?' ('+skipped+' undated rows skipped)':''), 6000);
}
function importJson(file){ const r=new FileReader(); r.onload=async ()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.items)||!Array.isArray(d.pillars)) throw new Error('shape'); plan=normalise(d); render(); await savePlan(); toast('Imported '+plan.items.length+' posts'); }catch(e){ toast('That file isn’t a calendar export'); } }; r.readAsText(file); }
function importFile(file){ if(/\.json$/i.test(file.name)) importJson(file); else importExcel(file); }

/* ---------- wiring ---------- */
function wire(){
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ view.mode=b.dataset.view; saveView(); render(); });
  $('#rangeStart').onchange=e=>{ if(view.mode==='weekly') view.wstart=e.target.value; else view.start=e.target.value; saveView(); render(); };
  $('#rangeLen').onchange=e=>{ if(view.mode==='weekly') view.weeks=Number(e.target.value); else view.len=Number(e.target.value); saveView(); render(); };
  $('#fChannel').onchange=e=>{ view.channel=e.target.value; saveView(); render(); };
  $('#fStatus').onchange=e=>{ view.status=e.target.value; saveView(); render(); };
  $('#fOwner').onchange=e=>{ view.owner=e.target.value; saveView(); render(); };
  $('#fSearch').oninput=e=>{ view.q=e.target.value; render(); };
  $('#btnAdd').onclick=()=>addItem();
  $('#btnPillars').onclick=openPillars; $('#btnOverview').onclick=openOverview;
  const menu=$('#exportMenu'), btn=$('#btnExport');
  btn.onclick=()=>{ menu.hidden=!menu.hidden; btn.setAttribute('aria-expanded', String(!menu.hidden)); if(!menu.hidden){ const r=btn.getBoundingClientRect(); menu.classList.toggle('flip', r.left + menu.offsetWidth > window.innerWidth - 12); } };
  document.addEventListener('click', e=>{ if(!e.target.closest('.menu')){ menu.hidden=true; btn.setAttribute('aria-expanded','false'); } });
  menu.querySelectorAll('button').forEach(b=>b.onclick=async ()=>{ menu.hidden=true; const k=b.dataset.export; if(k==='import'){ $('#fileImport').click(); return; } if(k==='reload'){ try{ localStorage.removeItem(LS_DATA); }catch(e){} location.reload(); return; } let m=null; if(k==='pptx'||k==='xlsx'){ m=await chooseMonth(k); if(!m) return; } toast(k==='pptx'?'Building the PowerPoint…':k==='xlsx'?'Building the workbook…':'Preparing file…', 1800); try{ if(k==='xlsx') await exportXlsx(m); else if(k==='pptx') await exportPptx(m); else await exportJson(); }catch(e){ console.error(e); toast('Export failed: '+(e&&e.message||e)); } });
  const fi=$('#fileImport'); if(fi) fi.onchange=e=>{ const f=e.target.files[0]; if(f) importFile(f); e.target.value=''; };
  $('#stage').addEventListener('click', e=>{ const pv=e.target.closest('[data-preview]'); if(pv){ const it=plan.items.find(i=>i.id===pv.dataset.preview); if(it) openPreview(previewFrom(it)); return; } const o=e.target.closest('[data-open]'); if(o){ openItem(o.dataset.open,false); return; } const a=e.target.closest('[data-add]'); if(a){ addItem(a.dataset.add); return; } const ad=e.target.closest('[data-add-date]'); if(ad) addItem('', ad.dataset.addDate); });
  $('#stage').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const o=e.target.closest('[data-open]'); if(o) openItem(o.dataset.open,false); } });
  let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(view.mode==='weekly') renderTimeline(); }, 120); });
}

(async function boot(){
  await loadPlan(); wire(); render();
  setChip('', 'Saved on this device');
  if(window.claude && typeof window.claude.use==='function'){
    const [a,d,as]=await Promise.all([window.claude.use('artifact').catch(()=>null), window.claude.use('downloads').catch(()=>null), window.claude.use('assets').catch(()=>null)]);
    artifactCap=a; downloadsCap=d; assetsCap=as; capsReady=true;
    setChip('', a?'Saves to the shared calendar':'Saved on this device');
  } else { capsReady=true; }
})();
})();
</script>
